<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>Friend Zone</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💜%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Sora:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2fc;--card:#fff;--tx:#1b1530;--mu:#7a7494;--bd:#e9e4f6;--ac:#7c3aed;--g:linear-gradient(135deg,#7c3aed,#ec4899 60%,#f97316)}
[data-theme=dark]{--bg:#0d0a19;--card:#171226;--tx:#f3f0ff;--mu:#9b94ba;--bd:#2a2343}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Hind Siliguri','Sora',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100dvh;transition:background .3s,color .3s}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
[hidden]{display:none!important}
.ic{width:22px;height:22px;flex:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px}
.btn{background:var(--g);color:#fff;padding:10px 18px;border-radius:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.o{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.s{padding:7px 12px;font-size:14px;border-radius:12px}
.in{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);outline:0;transition:border .2s}
.in:focus,button:focus-visible{border-color:var(--ac);outline:2px solid var(--ac);outline-offset:2px}
textarea.in{resize:none;min-height:90px}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;object-fit:cover;flex:none}
small{color:var(--mu)}
/* auth */
#auth{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 20%,#7c3aed55,transparent 45%),radial-gradient(circle at 85% 80%,#ec489955,transparent 45%),var(--bg);position:relative}
.ab2{position:absolute;top:14px;right:14px;display:flex;gap:6px}
.acard{width:100%;max-width:400px;padding:28px;display:grid;gap:12px}
.logo{font-family:Sora,sans-serif;font-weight:800;font-size:28px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.5px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:14px;padding:4px}
.tabs button{padding:9px;border-radius:11px;font-weight:600;color:var(--mu)}
.tabs .on{background:var(--card);color:var(--tx);box-shadow:0 2px 8px #0002}
.err{color:#ef4444;font-size:14px;min-height:18px}
/* shell */
.top{position:fixed;inset:0 0 auto 0;height:60px;z-index:20;display:flex;align-items:center;gap:6px;padding:0 14px;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
.top .sp{flex:1}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;position:relative;color:var(--tx)}
.ib:hover{background:var(--bg)}
.bd{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:#ef4444;color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.side{display:none;position:fixed;top:60px;bottom:0;left:0;width:76px;padding:14px 10px;flex-direction:column;gap:4px;border-right:1px solid var(--bd);background:var(--card);z-index:10}
.side button{display:flex;align-items:center;gap:14px;padding:12px;border-radius:14px;font-weight:600;color:var(--mu);position:relative}
.side button span{display:none}
.side button:hover{background:var(--bg)}
.side .on{background:var(--g);color:#fff}
.side .bd{top:4px;right:4px}
main{padding:72px 12px 92px;max-width:640px;margin:0 auto}
.bot{position:fixed;inset:auto 0 0 0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--bd)}
.bot button{display:grid;place-items:center;gap:2px;padding:6px;color:var(--mu);font-size:11px}
.bot .on{color:var(--ac)}
.bot .mid{width:52px;height:52px;margin:0 auto;border-radius:18px;background:var(--g);color:#fff;box-shadow:0 6px 18px #7c3aed66;transform:translateY(-8px)}
@media(min-width:700px){.side{display:flex}main{margin-left:calc(76px + (100vw - 76px - 640px)/2);margin-right:auto;padding:84px 16px 30px}.bot{display:none}.mobonly{display:none}}
@media(min-width:700px) and (max-width:1100px){main{margin:0 auto 0 76px;max-width:none;padding-right:16px}main>*{max-width:640px;margin-left:auto;margin-right:auto}}
@media(min-width:1100px){.side{width:236px}.side button span{display:inline}main{margin-left:calc(236px + (100vw - 236px - 640px)/2)}}
/* feed */
.stories{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none}
.st{display:grid;justify-items:center;gap:4px;font-size:12px;flex:none;width:64px}
.ring{padding:3px;border-radius:50%;background:var(--g);display:grid}
.ring .av{border:3px solid var(--card)}
.cp{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:14px;cursor:pointer;color:var(--mu)}
.cp span{flex:1}
.post{margin-bottom:14px;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:14px 14px 8px;cursor:pointer}
.ph div{display:grid;line-height:1.25}
.pt{padding:4px 16px 12px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.art{aspect-ratio:4/3;display:grid;place-items:center;font-size:84px}
.post img.m,.post video.m{width:100%;max-height:540px;object-fit:cover;display:block;background:#000}
.pa{display:flex;gap:4px;padding:6px 8px}
.ab{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;color:var(--mu);font-weight:600}
.ab:hover{background:var(--bg)}
.ab.on{color:#ec4899}
.cm{padding:4px 14px 14px;display:grid;gap:10px}
.ci{display:flex;gap:8px;align-items:flex-start}
.ci div{background:var(--bg);padding:8px 12px;border-radius:14px;display:grid;font-size:14px}
.cr{display:flex;gap:8px}
/* reels */
.reels{height:calc(100dvh - 160px);overflow-y:scroll;scroll-snap-type:y mandatory;border-radius:20px;scrollbar-width:none}
@media(min-width:700px){.reels{height:calc(100dvh - 110px)}}
.reel{height:100%;scroll-snap-align:start;position:relative;display:grid;place-items:center;overflow:hidden;background:#000;color:#fff}
.reel.an{background-size:300% 300%;animation:bg 8s ease infinite}
@keyframes bg{50%{background-position:100% 100%}}
.reel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reel .em{font-size:96px;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-14px) scale(1.06)}}
.rov{position:absolute;inset:auto 0 0 0;display:flex;align-items:flex-end;justify-content:space-between;padding:60px 14px 16px;background:linear-gradient(transparent,#000a)}
.rov .ri{display:grid;gap:6px;max-width:70%}
.rov .ra{display:grid;gap:4px}
.reel .ab{flex-direction:column;color:#fff;gap:2px;font-size:13px}
.reel .ab.on{color:#ff5fa8}
@media(prefers-reduced-motion:reduce){.reel.an,.reel .em{animation:none}}
/* lists */
.sec{font-weight:700;margin:16px 4px 10px}
.row{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px}
.row .gr{flex:1;display:grid;line-height:1.3;min-width:0;cursor:pointer}
.row .gr small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.un{border-color:var(--ac)}
.empty{text-align:center;color:var(--mu);padding:40px 0}
/* profile */
.cov{height:150px;border-radius:20px 20px 0 0;background:var(--g)}
.pi{padding:0 18px 18px;display:grid;gap:8px;margin-top:-44px}
.pi .av{border:4px solid var(--card)}
.stat{display:flex;gap:24px}
.stat div{display:grid;text-align:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:14px}
.grid>*{aspect-ratio:1;border-radius:12px;overflow:hidden;display:grid;place-items:center;font-size:36px}
.grid img,.grid video{width:100%;height:100%;object-fit:cover}
/* chat */
.ch{display:flex;flex-direction:column;height:calc(100dvh - 170px)}
@media(min-width:700px){.ch{height:calc(100dvh - 120px)}}
.chh{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--bd)}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.b{max-width:78%;padding:9px 14px;border-radius:18px;line-height:1.45;word-break:break-word}
.b.o{background:var(--bg);border-bottom-left-radius:6px;align-self:flex-start}
.b.m{background:var(--g);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.chf{display:flex;gap:8px;padding:10px;border-top:1px solid var(--bd)}
/* modal & toast */
.mod{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.sheet{width:100%;max-width:520px;max-height:88dvh;overflow-y:auto;padding:20px;border-radius:24px 24px 0 0;position:relative;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(min-width:700px){.mod{align-items:center}.sheet{border-radius:24px}}
.sheet .x{position:absolute;top:12px;right:12px}
.sheet h3{margin-bottom:12px}
.sheet>div{display:grid;gap:12px}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick label{cursor:pointer}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:14px;z-index:60;font-weight:600;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .3s}
#toast.s{opacity:1}
</style>
</head>
